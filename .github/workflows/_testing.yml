name: Unit Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_tests:
    runs-on: ${{ matrix.host-os }}
    strategy:
      matrix:
        host-os: ["ubuntu-latest"]
        python-version: ["py311-cpu", "py312-cpu", "py313-cpu"]
      fail-fast: false

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Set env vars
        run: |
          export REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}  # just the repo, as opposed to org/repo
          echo "REPOSITORY_NAME=${REPOSITORY_NAME}" >> "$GITHUB_ENV"

      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pixi and activate environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.82.1
          environments: ${{ matrix.python-version }}
          cache: false
          activate-environment: ${{ matrix.python-version }}

      - name: Run unit tests
        run: |
          if [ "${{ matrix.python-version }}" = "py313-cpu" ]; then
            pixi run -e ${{ matrix.python-version }} pytest --cov=bluesky_adaptive --cov-report=xml --cov-report=term src/bluesky_adaptive/tests --ignore=src/bluesky_adaptive/tests/integration -m "not integration"
          else
            pixi run tests
          fi

      - name: Upload coverage to Codecov
        if: matrix.python-version == 'py313-cpu'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
