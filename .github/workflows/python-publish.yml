name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # uv version comes from [tool.uv] required-version in pyproject.toml.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build distributions
        run: uv build
      - name: Publish distributions to PyPI
        # v1.14.3 ships certifi/sigstore without the compromised emSign CAs (GHSA-5xjx-3w67-w9x9).
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
