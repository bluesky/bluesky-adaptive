[workspace]
name = "bluesky-adaptive-queueserver-tutorial"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.82.1"

[dependencies]
ca-certificates = ">=2026.10.19"
python = ">=3.10,<3.13"

[pypi-dependencies]
certifi = ">=2026.10.19"
bluesky-queueserver = ">=0.0.26"
bluesky-queueserver-api = ">=0.0.14"
bluesky-tiled-plugins = "*"
tiled = { version = "*", extras = ["all"] }
ophyd = "*"
